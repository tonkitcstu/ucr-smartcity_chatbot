<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>น้องเมือง — เรื่องที่ชาวบ้านเล่ามา</title>
<link rel="stylesheet" href="/dashboard/vendor/leaflet.css">
<style>
  :root {
    --bg: #f5f4f1;  --panel: #fff;  --line: #e0ddd6;
    --ink: #26241f;  --dim: #6f6a60;
    --heat: #d9534f;  --flood: #3b82c4;  --access: #b8860b;
    --lighting: #7b5ea7;  --waste: #4f8a5b;  --other: #6f6a60;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans Thai", "Noto Sans Thai", -apple-system, sans-serif;
  }
  #map { flex: 1; }
  aside {
    width: 400px; background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 20px;
  }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: var(--dim); margin-bottom: 14px; }
  .sub a { color: var(--dim); }
  .empty { color: var(--dim); font-size: 14px; line-height: 1.7; padding-top: 10px; }

  /* ---- แถบเครื่องมือ ---- */
  .tools { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  input, select, .flagbtn, .clear {
    font-family: inherit; font-size: 13px; color: var(--ink);
    border: 1px solid var(--line); border-radius: 4px; background: #fff;
  }
  input, select { padding: 6px 8px; width: 100%; }
  input:focus, select:focus { outline: 2px solid #c9c4b8; outline-offset: -1px; }
  .two { display: flex; gap: 8px; align-items: center; }
  .two span { font-size: 12px; color: var(--dim); white-space: nowrap; }
  .flags { display: flex; gap: 6px; flex-wrap: wrap; }
  .flagbtn { padding: 4px 9px; font-size: 12px; color: var(--dim); cursor: pointer; }
  .flagbtn.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .clear {
    padding: 4px 9px; font-size: 12px; color: var(--dim);
    cursor: pointer; border-style: dashed; align-self: flex-start;
  }

  .counts { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .chip {
    font-size: 12px; padding: 3px 9px; border-radius: 99px; cursor: pointer;
    background: #eeece6; color: var(--dim); border: 1px solid transparent;
  }
  .chip b { color: var(--ink); }
  /* หัวข้อที่กำลังกรองอยู่ ต้องต่างจากที่ไม่ได้กรองแบบเห็นปราดเดียว */
  .chip.on { background: var(--ink); color: #fff; }
  .chip.on b { color: #fff; }
  .tallynote { flex-basis: 100%; font-size: 11px; color: var(--dim); margin-top: 2px; }

  /* ---- รายการเรื่อง ---- */
  .row {
    border-top: 1px solid var(--line); padding: 11px 0; cursor: pointer;
  }
  .row:hover .rowtitle { text-decoration: underline; }
  .rowtitle { font-size: 14px; line-height: 1.5; margin-bottom: 5px; }
  .rowmeta { font-size: 11px; color: var(--dim); display: flex; gap: 8px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 99px; margin-right: 6px; }
  .warn { color: #a8622a; }

  /* ---- รายละเอียดใบเดียว ---- */
  .back {
    font-size: 12px; color: var(--dim); cursor: pointer;
    background: none; border: none; padding: 0 0 12px; font-family: inherit;
  }
  .back:hover { text-decoration: underline; }
  .card { border-top: 1px solid var(--line); padding-top: 14px; }
  .cat {
    display: inline-block; font-size: 11px; color: #fff;
    padding: 2px 8px; border-radius: 3px; margin: 0 4px 8px 0;
  }
  /* หัวข้อรองของใบเดียวกัน — เห็นว่ามีอีก แต่ไม่แย่งสายตาไปจากเรื่องหลัก */
  .cat.alt { background: none; }
  .card h2 { font-size: 16px; margin: 0 0 10px; line-height: 1.4; }
  .notes { font-size: 14px; line-height: 1.75; margin-bottom: 16px; }

  dl { margin: 0; font-size: 13px; }
  dt { color: var(--dim); margin-top: 10px; }
  dd { margin: 2px 0 0; line-height: 1.6; }
  .said { border-left: 2px solid var(--line); padding-left: 9px; font-style: italic; }

  .shots { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .shot { width: 108px; }
  .shot img {
    width: 108px; height: 108px; object-fit: cover;
    border-radius: 4px; border: 1px solid var(--line); display: block;
  }
  .shot span { font-size: 11px; color: var(--dim); line-height: 1.4; display: block; margin-top: 4px; }

  .flag { font-size: 12px; color: var(--dim); margin-top: 12px; }
</style>
</head>
<body>
<div id="map"></div>
<aside id="side">
  <h1>เรื่องที่ชาวบ้านเล่ามา</h1>
  <div class="sub" id="sub">กำลังโหลด…</div>
  <div class="sub"><a href="/dashboard/broadcast">ทักไปคุยก่อน →</a></div>

  <div class="tools">
    <input id="q" type="search" placeholder="ค้นจากพาดหัว เรื่องที่เล่า หรือที่อยู่">
    <select id="sort">
      <option value="new">ใหม่สุดก่อน</option>
      <option value="old">เก่าสุดก่อน</option>
      <option value="sev">หนักไปเบา</option>
    </select>
    <div class="two">
      <span>วันที่</span>
      <input id="from" type="date">
      <span>ถึง</span>
      <input id="to" type="date">
    </div>
    <div class="flags">
      <button class="flagbtn" data-flag="nopin"
              title="เล่ามาแล้วแต่ไม่ได้แชร์พิกัด มีแต่ที่อยู่แบบพูด ต้องปักมือ">ยังไม่มีหมุด</button>
      <button class="flagbtn" data-flag="photo">มีรูป</button>
      <button class="flagbtn" data-flag="high">หนัก</button>
      <button class="flagbtn" data-flag="rescued" title="ระบบเก็บให้ก่อนหมดอายุ ไม่ได้ปิดใบเอง">ระบบเก็บให้</button>
    </div>
    <button class="clear" id="clear" hidden>ล้างตัวกรองทั้งหมด</button>
  </div>

  <div class="counts" id="counts"></div>
  <div id="panel"></div>
</aside>

<script src="/dashboard/vendor/leaflet.js"></script>
<script>
const CAT = {
  heat:     { name: "ความร้อน",     color: getVar("--heat") },
  flood:    { name: "น้ำท่วม",       color: getVar("--flood") },
  access:   { name: "การเข้าถึง",    color: getVar("--access") },
  lighting: { name: "ไฟส่องสว่าง",   color: getVar("--lighting") },
  waste:    { name: "ขยะ น้ำเสีย",   color: getVar("--waste") },
  other:    { name: "อื่น ๆ",        color: getVar("--other") },
};
const SEVERITY  = { low: "เล็กน้อย", medium: "ปานกลาง", high: "หนัก" };
const FREQUENCY = { once: "เกิดครั้งเดียว", occasional: "เกิดเป็นครั้งคราว", recurring: "เกิดซ้ำ ๆ" };
const TAGS = {
  health: "สุขภาพ", safety: "ความปลอดภัย", mobility: "การเดินทาง",
  property: "ทรัพย์สิน", income: "รายได้", daily_life: "ชีวิตประจำวัน",
};
const TIMES = { morning: "เช้า", afternoon: "บ่าย", evening: "เย็น", night: "กลางคืน" };
const SEV_RANK = { high: 3, medium: 2, low: 1 };

function getVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function cat(c) { return CAT[c] || CAT.other; }
// หนึ่งใบติดได้หลายหัวข้อ ตัวแรกคือเรื่องหลัก — หมุดมีสีเดียว ต้องมีกฎว่าใครได้สี
function cats(r) { return (r.categories || []).length ? r.categories : ["other"]; }
function main(r) { return cats(r)[0]; }
function pinned(r) { return r.latitude != null && r.longitude != null; }
function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[m]));
}

// วันที่แบบ YYYY-MM-DD ตามเวลาเครื่องคนดู ให้ตรงกับตัวเลขที่ <input type="date"> ส่งมา
// ถ้าเทียบกับ ISO ดิบซึ่งเป็น UTC ใบที่เข้ามาตอนดึกจะตกไปอยู่คนละวันกับที่เขาเห็นบนจอ
function dayOf(iso) {
  const d = new Date(iso);
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

const map = L.map("map").setView([13.7563, 100.5018], 11);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap", maxZoom: 19,
}).addTo(map);

// หมุดสร้างครั้งเดียวตอนโหลด แล้วเอาเข้า-ออกชั้นนี้ตอนกรอง จะได้ไม่ต้องสร้างใหม่ทุกครั้ง
const pins = L.layerGroup().addTo(map);
const marks = {};

let ALL = [];
let open = null;   // ใบที่กางรายละเอียดอยู่ — null = โชว์รายการ
const filter = { cats: new Set(), flags: new Set(), from: "", to: "", q: "", sort: "new" };

fetch("/api/dashboard/reports")
  .then(r => r.json())
  .then(draw)
  .catch(e => {
    document.getElementById("sub").textContent = "ต่อกับเซิร์ฟเวอร์ไม่ได้";
    console.error(e);
  });

function draw(reports) {
  ALL = reports;

  reports.filter(pinned).forEach(r => {
    const m = L.circleMarker([r.latitude, r.longitude], {
      radius: 9, color: "#fff", weight: 2,
      fillColor: cat(main(r)).color, fillOpacity: 0.95,
    });
    m.on("click", () => show(r));
    marks[r.id] = m;
  });

  // ป้ายนับ = ตัวกรองหัวข้อในตัว ตัวเลขเป็นยอดรวมทั้งหมดเสมอ ไม่ใช่ยอดหลังกรอง
  // เพราะถ้าตัวเลขขยับตามตัวกรองด้วย จะอ่านไม่ออกว่าที่เหลืออีกกี่ใบที่ซ่อนอยู่
  const tally = {};
  reports.forEach(r => cats(r).forEach(c => tally[c] = (tally[c] || 0) + 1));
  document.getElementById("counts").innerHTML = Object.entries(tally)
    .sort((a, b) => b[1] - a[1])
    .map(([c, n]) => `<span class="chip" data-cat="${c}"
        style="border-left:3px solid ${cat(c).color}">${cat(c).name} <b>${n}</b></span>`).join("")
    + `<div class="tallynote">หนึ่งเรื่องติดได้หลายหัวข้อ ผลรวมจึงมากกว่าจำนวนเรื่อง · กดเพื่อกรอง</div>`;

  const days = reports.map(r => dayOf(r.created_at)).sort();
  if (days.length) {
    for (const id of ["from", "to"]) {
      Object.assign(document.getElementById(id), { min: days[0], max: days[days.length - 1] });
    }
  }

  wire();

  const spots = reports.filter(pinned);
  if (spots.length) {
    map.fitBounds(L.latLngBounds(spots.map(r => [r.latitude, r.longitude])),
                  { padding: [70, 70], maxZoom: 15 });
  }
  render();
}

function wire() {
  const touch = () => { open = null; render(); };   // เปลี่ยนตัวกรองแล้วกลับมาที่รายการเสมอ

  document.getElementById("q").oninput = e => { filter.q = e.target.value.trim(); touch(); };
  document.getElementById("sort").onchange = e => { filter.sort = e.target.value; touch(); };
  for (const id of ["from", "to"]) {
    document.getElementById(id).onchange = e => { filter[id] = e.target.value; touch(); };
  }
  document.querySelectorAll(".flagbtn").forEach(b => {
    b.onclick = () => { toggle(filter.flags, b.dataset.flag); touch(); };
  });
  document.querySelectorAll(".chip[data-cat]").forEach(c => {
    c.onclick = () => { toggle(filter.cats, c.dataset.cat); touch(); };
  });
  document.getElementById("clear").onclick = () => {
    filter.cats.clear(); filter.flags.clear();
    Object.assign(filter, { from: "", to: "", q: "" });
    document.getElementById("q").value = "";
    document.getElementById("from").value = "";
    document.getElementById("to").value = "";
    touch();
  };
}

function toggle(set, key) { set.has(key) ? set.delete(key) : set.add(key); }

function active() {
  return filter.cats.size || filter.flags.size || filter.from || filter.to || filter.q;
}

function keep(r) {
  // เลือกหลายหัวข้อ = เอาใบที่ติดหัวข้อไหนก็ได้ในนั้น ไม่ใช่ต้องติดครบทุกอัน
  if (filter.cats.size && !cats(r).some(c => filter.cats.has(c))) return false;

  const f = filter.flags;
  if (f.has("nopin")   && pinned(r)) return false;
  if (f.has("photo")   && !(r.images || []).length) return false;
  if (f.has("high")    && r.severity !== "high") return false;
  if (f.has("rescued") && r.source !== "rescued") return false;

  const day = dayOf(r.created_at);
  if (filter.from && day < filter.from) return false;
  if (filter.to   && day > filter.to) return false;

  if (filter.q) {
    const hay = [r.title, r.notes, r.location_text].join(" ").toLowerCase();
    if (!hay.includes(filter.q.toLowerCase())) return false;
  }
  return true;
}

function visible() {
  const list = ALL.filter(keep);
  const newest = (a, b) => new Date(b.created_at) - new Date(a.created_at);

  if (filter.sort === "old") return list.sort((a, b) => -newest(a, b));
  if (filter.sort === "sev") {
    return list.sort((a, b) =>
      (SEV_RANK[b.severity] || 0) - (SEV_RANK[a.severity] || 0) || newest(a, b));
  }
  return list.sort(newest);
}

function render() {
  const list = visible();
  const withPin = list.filter(pinned);

  document.getElementById("sub").textContent = active()
    ? `แสดง ${list.length} จาก ${ALL.length} เรื่อง · ปักหมุดได้ ${withPin.length}`
    : `${ALL.length} เรื่อง · ปักหมุดได้ ${withPin.length} · ยังไม่มีหมุด ${ALL.length - withPin.length}`;

  document.getElementById("clear").hidden = !active();
  document.querySelectorAll(".chip[data-cat]").forEach(c =>
    c.classList.toggle("on", filter.cats.has(c.dataset.cat)));
  document.querySelectorAll(".flagbtn").forEach(b =>
    b.classList.toggle("on", filter.flags.has(b.dataset.flag)));

  pins.clearLayers();
  withPin.forEach(r => pins.addLayer(marks[r.id]));

  const box = document.getElementById("panel");
  box.innerHTML = open ? detail(open) : rows(list);

  if (open) {
    box.querySelector(".back").onclick = () => { open = null; render(); };
  } else {
    box.querySelectorAll(".row").forEach(el => {
      el.onclick = () => show(ALL.find(r => r.id == el.dataset.id));
    });
  }
}

function rows(list) {
  if (!list.length) {
    return `<div class="empty">${active()
      ? "ไม่มีเรื่องไหนตรงกับตัวกรองนี้"
      : "ยังไม่มีเรื่องเข้ามาเลย"}</div>`;
  }
  return list.map(r => {
    const bits = [new Date(r.created_at).toLocaleDateString("th-TH")];
    if (r.severity) bits.push(SEVERITY[r.severity]);
    if ((r.images || []).length) bits.push(`${r.images.length} รูป`);
    bits.push(pinned(r)
      ? esc(r.location_text || "ปักหมุดไว้แล้ว")
      : `<span class="warn">ยังไม่มีหมุด${r.location_text ? " · " + esc(r.location_text) : ""}</span>`);

    return `<div class="row" data-id="${r.id}">
      <div class="rowtitle">
        <span class="dot" style="background:${cat(main(r)).color}"></span>
        ${esc(r.title || r.notes.slice(0, 40))}
      </div>
      <div class="rowmeta">${bits.join(" · ")}</div>
    </div>`;
  }).join("");
}

function show(r) {
  open = r;
  render();
  document.getElementById("side").scrollTop = 0;
  if (marks[r.id]) map.setView(marks[r.id].getLatLng(), Math.max(map.getZoom(), 15));
}

function detail(r) {
  const lines = [];
  const add = (label, value, cls) => {
    if (value) lines.push(`<dt>${label}</dt><dd class="${cls || ""}">${esc(value)}</dd>`);
  };

  add("เขาบอกว่าสาเหตุคือ", r.cause_said, "said");
  add("เกิดตอนไหน", r.occurred_said, "said");
  add("บ่อยแค่ไหน", FREQUENCY[r.frequency]);
  add("ช่วงเวลา", (r.time_of_day || []).map(t => TIMES[t] || t).join(" · "));
  add("เดือดร้อนยังไง", r.affect_desc);
  add("กระทบด้าน", (r.affect_tags || []).map(t => TAGS[t] || t).join(" · "));
  add("ที่อยู่ที่บอกไว้", r.location_text);
  add("บันทึกเมื่อ", new Date(r.created_at).toLocaleString("th-TH"));

  const flags = [];
  if (r.no_location) flags.push("เขาบอกเองว่าแชร์ตำแหน่งไม่ได้");
  if (r.no_photo)    flags.push("เขาบอกเองว่าถ่ายรูปไม่ได้");
  if (r.source === "rescued") flags.push("ใบนี้ระบบเก็บให้ก่อนหมดอายุ ไม่ได้ปิดเอง");

  const shots = (r.images || []).map(img => `
    <div class="shot">
      <a href="/api/dashboard/image/${img.id}" target="_blank">
        <img src="/api/dashboard/image/${img.id}" alt="">
      </a>
      <span>${esc(img.descr || "ไม่รู้ว่าคุยเรื่องอะไรอยู่ตอนส่งรูป")}</span>
    </div>`).join("");

  return `
    <button class="back">← กลับไปที่รายการ</button>
    <div class="card">
      <span class="cat" style="background:${cat(main(r)).color}">
        ${cat(main(r)).name}${r.severity ? " · " + SEVERITY[r.severity] : ""}</span>
      ${cats(r).slice(1).map(c => `<span class="cat alt"
         style="color:${cat(c).color};box-shadow:inset 0 0 0 1px ${cat(c).color}">
         ${cat(c).name}</span>`).join("")}
      <h2>${esc(r.title || "(ไม่มีพาดหัว)")}</h2>
      <div class="notes">${esc(r.notes)}</div>
      <dl>${lines.join("")}</dl>
      ${shots ? `<div class="shots">${shots}</div>` : ""}
      ${flags.length ? `<div class="flag">${flags.map(esc).join("<br>")}</div>` : ""}
    </div>`;
}
</script>
</body>
</html>
