# ขึ้นทั้งระบบ: docker compose up -d --build
# ต้องมี .env (cp .env.example .env) และตั้ง POSTGRES_PASSWORD ในนั้น
# ไฟล์เดียวใช้ทั้งเครื่อง dev และ EC2 · ngrok / HTTPS อยู่นอกไฟล์นี้
#
# แต่ละตัวมีไฟล์ของตัวเองใน docker/ — ไฟล์นี้รวม 3 ตัวเข้าด้วยกัน และบอกว่าใครต้องรอใคร
# เปิดทีละตัวได้ด้วยไฟล์ของตัวนั้น (ดูคำสั่งที่หัวไฟล์) หรือ docker compose up -d <ชื่อ service>

name: ucr-smartcity_chatbot

include:
  - path: docker/postgres/docker-compose.yml
    env_file: .env
  - path: docker/redis/docker-compose.yml
    env_file: .env

services:
  app:
    # ตัวแอปนิยามไว้ใน docker/app/docker-compose.yml — ที่นี่เพิ่มแค่ลำดับการเปิด
    extends:
      file: docker/app/docker-compose.yml
      service: app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  uploads:
