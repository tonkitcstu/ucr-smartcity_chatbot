th:1.5;"/><text x="137.713" y="450.489" fill="#000" font-size="13" textLength="16.006" font-weight="700" font-family="'Thonburi'">alt</text><text x="198.719" y="449.192" fill="#000" font-size="11" textLength="252.093" font-weight="700" font-family="'Thonburi'">[ผู้รับคนเดียว — User หนึ่งคน หรือรายการที่มีคนเดียว]</text><polygon points="168.713,520.283,158.713,524.283,168.713,528.283,164.713,524.283" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="162.713" y1="524.283" x2="505.604" y2="524.283" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="231.932" y="501.422" fill="#000" font-size="13" font-weight="700" font-family="'Thonburi'">2</text><text x="294.044" y="483.527" fill="#000" font-size="13" textLength="88.893" font-family="'Thonburi'">push message</text><text x="244.595" y="501.422" fill="#000" font-size="13" textLength="187.789" font-family="'Thonburi'">POST /v2/bot/message/push</text><text x="245.537" y="519.317" fill="#000" font-size="13" textLength="185.905" font-family="'Thonburi'">to = line_user_id · messages</text><line x1="122.713" y1="533.283" x2="620.762" y2="533.283" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="127.713" y="547.916" fill="#000" font-size="11" textLength="68.294" font-weight="700" font-family="'Thonburi'">[ผู้รับหลายคน]</text><path d="M141.713,557.425 L213.342,557.425 L213.342,567.32 L203.342,577.32 L141.713,577.32 L141.713,557.425" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="141.713" y="557.425" width="380.892" height="97.723" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="156.713" y="573.355" fill="#000" font-size="13" textLength="26.63" font-weight="700" font-family="'Thonburi'">loop</text><text x="228.342" y="572.058" fill="#000" font-size="11" textLength="233.084" font-weight="700" font-family="'Thonburi'">[ทีละกลุ่ม กลุ่มละไม่เกิน 500 คน เรียงตามรายการ]</text><polygon points="168.713,643.148,158.713,647.148,168.713,651.148,164.713,647.148" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="162.713" y1="647.148" x2="505.604" y2="647.148" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="169.713" y="624.287" fill="#000" font-size="13" font-weight="700" font-family="'Thonburi'">3</text><text x="279.982" y="606.392" fill="#000" font-size="13" textLength="117.015" font-family="'Thonburi'">multicast message</text><text x="230.534" y="624.287" fill="#000" font-size="13" textLength="215.912" font-family="'Thonburi'">POST /v2/bot/message/multicast</text><text x="182.376" y="642.183" fill="#000" font-size="13" textLength="312.228" font-family="'Thonburi'">to = line_user_id ของทั้งกลุ่ม · messages ชุดเดียวกัน</text><line x1="122.713" y1="670.148" x2="620.762" y2="670.148" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="127.713" y="684.781" fill="#000" font-size="11" textLength="117.369" font-weight="700" font-family="'Thonburi'">[ไม่มีผู้รับ — รายการว่าง]</text><line x1="506.604" y1="714.186" x2="548.604" y2="714.186" style="stroke:#181818;stroke-width:1;"/><line x1="548.604" y1="714.186" x2="548.604" y2="727.186" style="stroke:#181818;stroke-width:1;"/><line x1="507.604" y1="727.186" x2="548.604" y2="727.186" style="stroke:#181818;stroke-width:1;"/><polygon points="517.604,723.186,507.604,727.186,517.604,731.186,513.604,727.186" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="513.604" y="709.22" fill="#000" font-size="13" font-weight="700" font-family="'Thonburi'">4</text><text x="526.267" y="709.22" fill="#000" font-size="13" textLength="71.495" font-family="'Thonburi'">ไม่เรียก LINE</text><polygon points="228.435,769.081,218.435,773.081,228.435,777.081,224.435,773.081" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="222.435" y1="773.081" x2="505.604" y2="773.081" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="313.199" y="768.116" fill="#000" font-size="13" font-weight="700" font-family="'Thonburi'">5</text><text x="325.862" y="768.116" fill="#000" font-size="13" textLength="84.977" font-family="'Thonburi'">ส่งแล้ว ไม่คืนค่า</text><path d="M15,786.081 L15,849.081 L709,849.081 L709,796.081 L699,786.081 L15,786.081" style="stroke:#181818;stroke-width:0.5;" fill="#F0F0F0"/><path d="M699,786.081 L699,796.081 L709,796.081 L699,786.081" style="stroke:#181818;stroke-width:0.5;" fill="#F0F0F0"/><text x="21" y="806.011" fill="#000" font-size="13" textLength="637.284" font-family="'Thonburi'">push ส่งอย่างเดียวเหมือน reply — ไม่บันทึกลง messages ไม่ต่อประวัติใน Redis ไม่ผ่านคิวงาน ไม่แตะ state ของใบ</text><text x="21" y="823.906" fill="#000" font-size="13" textLength="673.039" font-family="'Thonburi'">ข้อความที่ส่งถึงชาวบ้านต้องมาจาก AI หรือแอดมินพิมพ์เอง (TC7 — AI เป็นคนเขียนเสมอ ยกเว้น 3 กรณี) เป็นหน้าที่ของผู้เรียก</text><text x="21" y="841.802" fill="#000" font-size="13" textLength="426.75" font-family="'Thonburi'">โควตานับตามจำนวนคนรับ — ส่ง 5 ข้อความถึง 1 คนนับ 1 · ส่งถึง 3 คนนับ 3</text><path d="M43.009,859.767 L43.009,922.767 L621.009,922.767 L621.009,869.767 L611.009,859.767 L43.009,859.767" style="stroke:#181818;stroke-width:0.5;" fill="#F0F0F0"/><path d="M611.009,859.767 L611.009,869.767 L621.009,869.767 L611.009,859.767" style="stroke:#181818;stroke-width:0.5;" fill="#F0F0F0"/><text x="49.009" y="879.697" fill="#000" font-size="13" textLength="479.817" font-family="'Thonburi'">LINE ตอบ error (เช่น 429 เมื่อโควตาของเดือนหมด) → error ของ SDK ขึ้นไปถึงผู้เรียก</text><text x="49.009" y="897.592" fill="#000" font-size="13" textLength="437.46" font-family="'Thonburi'">ส่งหลายกลุ่มแล้วพังกลางทาง → กลุ่มก่อนหน้าถึงผู้รับไปแล้ว — นอก happy path</text><text x="49.009" y="915.487" fill="#000" font-size="13" textLength="557.298" font-family="'Thonburi'">LINE ตอบ 200 ทั้งที่ผู้รับบล็อกหรือยังไม่เป็นเพื่อน → จ