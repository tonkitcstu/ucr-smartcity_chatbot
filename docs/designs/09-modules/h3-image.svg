434,56.272 L1401.434,46.272 L1076.89,46.272 A0,0 0 0 0 1076.89,46.272" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1401.434,46.272 L1401.434,56.272 L1411.434,56.272 L1401.434,46.272" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1082.89" y="66.202" fill="#000" font-size="13" textLength="79.082" font-weight="700" font-family="'Thonburi'">on_message</text><text x="1166.288" y="66.202" fill="#000" font-size="13" textLength="136.942" font-family="'Thonburi'">(รูปมาตอน BUFFERING)</text><text x="1082.89" y="84.097" fill="#000" font-size="13" textLength="313.544" font-family="'Thonburi'">1. to_incoming(event) → IncomingMessage ของรูป</text><text x="1082.89" y="101.992" fill="#000" font-size="13" textLength="244.222" font-family="'Thonburi'">2. session.open_for(user) → ใบที่เปิดอยู่</text><text x="1082.89" y="119.887" fill="#000" font-size="13" textLength="280.516" font-family="'Thonburi'">3. session.save_message(session, incoming)</text><text x="1082.89" y="137.783" fill="#000" font-size="13" textLength="171.468" font-family="'Thonburi'">4. session.buffer(message)</text><text x="1082.89" y="155.678" fill="#000" font-size="13" textLength="273.827" font-family="'Thonburi'">5. session.start_buffering(session) ได้ False</text><text x="1095.839" y="173.573" fill="#000" font-size="13" textLength="221.706" font-family="'Thonburi'">(BUFFERING อยู่แล้ว) → ไม่ใส่ใบสั่งงาน</text><text x="1082.89" y="191.469" fill="#000" font-size="13" textLength="48.821" font-family="'Thonburi'">ไม่ reply</text><text x="1082.89" y="209.364" fill="#000" font-size="13" font-family="'Thonburi'"> </text><text x="1082.89" y="227.259" fill="#000" font-size="13" textLength="78.096" font-weight="700" font-family="'Thonburi'">to_incoming</text><text x="1082.89" y="245.155" fill="#000" font-size="13" textLength="283.72" font-family="'Thonburi'">ข้อความ text → type text · content = ข้อความ</text><text x="1082.89" y="263.05" fill="#000" font-size="13" textLength="222.32" font-family="'Thonburi'">รูป → type image · content = None</text><text x="1095.839" y="280.945" fill="#000" font-size="13" textLength="289.234" font-family="'Thonburi'">line_message_id = id รูป (worker ใช้ดาวน์โหลด)</text><text x="1082.89" y="298.841" fill="#000" font-size="13" textLength="93.234" font-family="'Thonburi'">ชนิดอื่น → None</text></g><g class="entity" data-qualified-name="GMN17" id="ent0018" data-source-line="83"><path d="M6,869.822 L6,951.403 A0,0 0 0 0 6,951.403 L376.329,951.403 A0,0 0 0 0 376.329,951.403 L376.329,879.822 L366.329,869.822 L244.55,869.822 L474.42,678.962 L236.55,869.822 L6,869.822 A0,0 0 0 0 6,869.822" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M366.329,869.822 L366.329,879.822 L376.329,879.822 L366.329,869.822" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="889.752" fill="#000" font-size="13" textLength="99.577" font-weight="700" font-family="'Thonburi'">insert_message</text><text x="12" y="907.647" fill="#000" font-size="13" textLength="222.813" font-family="'Thonburi'">รูป: type = image · content = NULL</text><text x="12" y="925.542" fill="#000" font-size="13" textLength="349.329" font-family="'Thonburi'">line_message_id เก็บไว้ · role = user · status = pending</text><text x="12" y="943.437" fill="#000" font-size="13" textLength="338.33" font-family="'Thonburi'">attachment ยังไม่เกิด — worker สร้างตอนดาวน์โหลด (H4)</text></g><g class="entity" data-qualified-name="GMN20" id="ent0021" data-source-line="90"><path d="M842.96,878.772 L842.96,942.458 A0,0 0 0 0 842.96,942.458 L1191.367,942.458 A0,0 0 0 0 1191.367,942.458 L1191.367,888.772 L1181.367,878.772 L1021.16,878.772 L1017.16,688.682 L1013.16,878.772 L842.96,878.772 A0,0 0 0 0 842.96,878.772" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1181.367,878.772 L1181.367,888.772 L1191.367,888.772 L1181.367,878.772" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="848.96" y="898.702" fill="#000" font-s