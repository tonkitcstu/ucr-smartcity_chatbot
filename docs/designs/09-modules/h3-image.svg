="79.86" font-family="'Thonburi'">message.py</text><line x1="437.57" y1="822.524" x2="773.546" y2="822.524" style="stroke:#181818;stroke-width:0.5;"/><text x="442.57" y="842.602" fill="#000" font-size="14" textLength="325.976" font-family="'Thonburi'">IncomingMessage  (แกะจาก event แล้ว ยังไม่บันทึก)</text><line x1="437.57" y1="849.796" x2="773.546" y2="849.796" style="stroke:#181818;stroke-width:1;"/><text x="442.57" y="869.874" fill="#000" font-size="14" textLength="119.219" font-family="'Thonburi'">line_event_id: str</text><text x="442.57" y="889.146" fill="#000" font-size="14" textLength="140" font-family="'Thonburi'">line_message_id: str</text><text x="442.57" y="908.417" fill="#000" font-size="14" textLength="108.615" font-family="'Thonburi'">reply_token: str</text><text x="442.57" y="927.689" fill="#000" font-size="14" textLength="148.384" font-family="'Thonburi'">type: "text" | "image"</text><text x="442.57" y="946.961" fill="#000" font-size="14" textLength="218.826" font-family="'Thonburi'">content: str | None  (รูป = None)</text><line x1="437.57" y1="954.155" x2="773.546" y2="954.155" style="stroke:#181818;stroke-width:1;"/><line x1="437.57" y1="956.155" x2="773.546" y2="956.155" style="stroke:#181818;stroke-width:1;"/><text x="442.57" y="974.233" fill="#000" font-size="14" textLength="268.368" font-family="'Thonburi'">Message(IncomingMessage)  (บันทึกแล้ว)</text><line x1="437.57" y1="981.427" x2="773.546" y2="981.427" style="stroke:#181818;stroke-width:1;"/><text x="442.57" y="1001.505" fill="#000" font-size="14" textLength="120.98" font-family="'Thonburi'">message_id: UUID</text><text x="442.57" y="1020.777" fill="#000" font-size="14" textLength="111.191" font-family="'Thonburi'">session_id: UUID</text></g><g class="entity" data-qualified-name="GMN14" id="ent0015" data-source-line="66"><path d="M1102.29,46.272 L1102.29,172.542 L1067.56,176.542 L1102.29,180.542 L1102.29,306.806 A0,0 0 0 0 1102.29,306.806 L1436.834,306.806 A0,0 0 0 0 1436.834,306.806 L1436.834,56.272 L1426.834,46.272 L1102.29,46.272 A0,0 0 0 0 1102.29,46.272" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1426.834,46.272 L1426.834,56.272 L1436.834,56.272 L1426.834,46.272" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1108.29" y="66.202" fill="#000" font-size="13" textLength="79.082" font-weight="700" font-family="'Thonburi'">on_message</text><text x="1191.688" y="66.202" fill="#000" font-size="13" textLength="136.942" font-family="'Thonburi'">(รูปมาตอน BUFFERING)</text><text x="1108.29" y="84.097" fill="#000" font-size="13" textLength="313.544" font-family="'Thonburi'">1. to_incoming(event) → IncomingMessage ของรูป</text><text x="1108.29" y="101.992" fill="#000" font-size="13" textLength="244.222" font-family="'Thonburi'">2. session.open_for(user) → ใบที่เปิดอยู่</text><text x="1108.29" y="119.887" fill="#000" font-size="13" textLength="280.516" font-family="'Thonburi'">3. session.save_message(session, incoming)</text><text x="1108.29" y="137.783" fill="#000" font-size="13" textLength="171.468" font-family="'Thonburi'">4. session.buffer(message)</text><text x="1108.29" y="155.678" fill="#000" font-size="13" textLength="273.827" font-family="'Thonburi'">5. session.start_buffering(session) ได้ False</text><text x="1121.239" y="173.573" fill="#000" font-size="13" textLength="221.706" font-family="'Thonburi'">(BUFFERING อยู่แล้ว) → ไม่ใส่ใบสั่งงาน</text><text x="1108.29" y="191.469" fill="#000" font-size="13" textLength="48.821" font-family="'Thonburi'">ไม่ reply</text><text x="1108.29" y="209.364" fill="#000" font-size="13" font-family="'Thonburi'"> </text><text x="1108.29" y="227.259" fill="#000" font-size="13" textLength="78.096" font-weight="700" font-family="'Thonburi'">to_incoming</text><text x="1108.29" y="245.155" fill="#000" font-size="13" textLength="283.72" font-family="'Thonburi'">ข้อความ text → type text · content = ข้อความ</text><text x="1108.29" y="263.05" fill="#000" font-size="13" textLength="222.32" font-family="'Thonburi'">รูป → type image · content = None</text><text x="1121.239" y="280.945" fill="#000" font-size="13" textLength="289.234" font-family="'Thonburi'">line_message_id = id รูป (worker ใช้ดาวน์โหลด)</text><text x="1108.29" y="298.841" fill="#000" font-size="13" textLength="93.234" font-family="'Thonburi'">ชนิดอื่น → None</text></g><g class="entity" data-qualified-name="GMN17" id="ent0018" data-source-line="83"><path d="M6,869.822 L6,951.403 A0,0 0 0 0 6,951.403 L401.115,951.403 A0,0 0 0 0 401.115,951.403 L401.115,879.822 L391.115,869.822 L258.89,869.822 L498,678.962 L250.89,869.822 L6,869.822 A0,0 0 0 0 6,869.822" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M391.115,869.822 L391.115,879.822 L401.115,879.822 L391.115,869.822" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="889.752" fill="#000" font-size="13" textLength="99.577" font-weight="700" font-family="'Thonburi'">insert_message</text><text x="12" y="907.647" fill="#000" font-size="13" textLength="222.813" font-family="'Thonburi'">รูป: type = image · content = NULL</text><text x="12" y="925.542" fill="#000" font-size="13" textLength="374.115" font-family="'Thonburi'">line_message_id เก็บไว้ · role = reporter · status = pending</text><text x="12" y="943.437" fill="#000" font-size="13" textLength="338.33" font-family="'Thonburi'">attachment ยังไม่เกิด — worker สร้างตอนดาวน์โหลด (H4)</text></g><g class="entity" data-qualified-name="GMN20" id="ent0021" data-source-line="90"><path d="M868.35,878.772 L868.35,942.458 A0,0 0 0 0 868.35,942.458 L1216.757,942.458 A0,0 0 0 0 1216.757,942.458 L1216.757,888.772 L1206.757,878.772 L1046.56,878.772 L1042.56,688.682 L1038.56,878.772 L868.35,878.772 A0,0 0 0 0 868.35,878.772" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1206.757,878.772 L1206.757,888.772 L1216.757,888.772 L1206.757,878.772" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="874.35" y="898.702" fill="#000" font