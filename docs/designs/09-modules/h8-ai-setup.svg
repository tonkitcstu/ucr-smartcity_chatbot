09" y="521.402" fill="#000" font-size="13" textLength="242.765" font-family="'Thonburi'">PSQL เป็นตัวจริง · default ใช้ตอนหาไม่เจอ</text><text x="239.62" y="539.297" fill="#000" font-size="13" textLength="356.428" font-family="'Thonburi'">has_ai_config() ได้ True → ไม่ทำอะไร (เปิดแอปซ้ำไม่เพิ่มแถว)</text><text x="239.62" y="557.192" fill="#000" font-size="13" textLength="373.11" font-family="'Thonburi'">ได้ False (ฐานว่าง) → insert_ai_config(ค่าจาก default_config)</text><text x="239.62" y="575.087" fill="#000" font-size="13" textLength="372.445" font-family="'Thonburi'">ตัวคุย / ตัววิเคราะห์ไม่เปลี่ยน — อ่านแถวล่าสุดจาก PSQL เหมือนเดิม</text><text x="239.62" y="592.983" fill="#000" font-size="13" textLength="461.759" font-family="'Thonburi'">เปลี่ยน prompt ทีหลัง = เพิ่ม ai_configs แถวใหม่ใน PSQL — งานแอดมิน นอก H8</text></g><g class="entity" data-qualified-name="GMN21" id="ent0022" data-source-line="87"><path d="M914.72,741.482 L914.72,858.854 A0,0 0 0 0 914.72,858.854 L1397.286,858.854 A0,0 0 0 0 1397.286,858.854 L1397.286,751.482 L1387.286,741.482 L1160,741.482 L1156,589.452 L1152,741.482 L914.72,741.482 A0,0 0 0 0 914.72,741.482" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1387.286,741.482 L1387.286,751.482 L1397.286,751.482 L1387.286,741.482" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="920.72" y="761.412" fill="#000" font-size="13" textLength="87.948" font-weight="700" font-family="'Thonburi'">has_ai_config</text><text x="1012.984" y="761.412" fill="#000" font-size="13" textLength="167.68" font-family="'Thonburi'">ai_configs มีอย่างน้อย 1 แถว</text><text x="920.72" y="779.307" fill="#000" font-size="13" textLength="102.507" font-weight="700" font-family="'Thonburi'">insert_ai_config</text><text x="1027.543" y="779.307" fill="#000" font-size="13" textLength="105.889" font-family="'Thonburi'">transaction เดียว:</text><text x="929.353" y="797.202" fill="#000" font-size="13" textLength="208.655" font-family="'Thonburi'">