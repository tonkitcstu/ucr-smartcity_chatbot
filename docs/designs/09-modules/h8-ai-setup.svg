620.285,46.272 L620.285,56.272 L630.285,56.272 L620.285,46.272" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="325.71" y="66.202" fill="#000" font-size="13" textLength="48.263" font-weight="700" font-family="'Thonburi'">lifespan</text><text x="325.71" y="84.097" fill="#000" font-size="13" textLength="124.516" font-family="'Thonburi'">ต่อ database + redis</text><text x="325.71" y="101.992" fill="#000" font-size="13" textLength="220.507" font-family="'Thonburi'">→ prompt.ensure_default_config()</text><text x="325.71" y="119.887" fill="#000" font-size="13" textLength="289.575" font-family="'Thonburi'">→ เปิด worker / sweeper (WORKER_ENABLED)</text></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="62"><path d="M2279.27,420.942 L2279.27,681.476 L2868.73,681.476 L2868.73,430.942 L2858.73,420.942 L2279.27,420.942" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M2858.73,420.942 L2858.73,430.942 L2868.73,430.942 L2858.73,420.942" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="2285.27" y="440.872" fill="#000" font-size="13" textLength="399.095" font-family="'Thonburi'">ค่าตั้งต้น ใช้เมื่อหา ai_configs ใน PSQL ไม่เจอเท่านั้น (ฐานใหม่ครั้งแรก)</text><text x="2285.27" y="458.767" fill="#000" font-size="13" textLength="308.115" font-family="'Thonburi'">ฐานมีแถวแล้ว PSQL เป็นตัวจริง — แก้ไฟล์นี้ไม่เปลี่ยนฐาน</text><text x="2285.27" y="476.662" fill="#000" font-size="13" textLength="133.108" font-family="'Thonburi'">PROVIDER = "gemini"</text><text x="2285.27" y="494.557" fill="#000" font-size="13" textLength="378.935" font-family="'Thonburi'">CHAT_MODEL / ANALYSER_MODEL = "gemini-3.5-flash-lite"</text><text x="2293.903" y="512.453" fill="#000" font-size="13" textLength="370.017" font-family="'Thonburi'">(ฟรีมีโควตาพอใช้ · flash ทำตาม prompt ดีกว่า แต่โควตาฟรีน้อย)</text><text x="2285.27" y="530.348" fill="#000" font-size="13" textLength="568.46" font-family="'Thonburi'">CHAT_PROMPT — ยกจาก ucr_v4.