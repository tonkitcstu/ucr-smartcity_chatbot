00" font-size="13" textLength="329.194" font-family="'Thonburi'">WORKER_ENABLED ปิด → app.state.background = {}</text><text x="77.48" y="191.469" fill="#000" font-size="13" textLength="319.231" font-family="'Thonburi'">ปิดแอป → ยกเลิก task ทุกตัวใน app.state.background</text></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="80"><path d="M399.21,397.252 L399.21,469.832 L364.97,473.832 L399.21,477.832 L399.21,550.414 A0,0 0 0 0 399.21,550.414 L704.103,550.414 A0,0 0 0 0 704.103,550.414 L704.103,407.252 L694.103,397.252 L399.21,397.252 A0,0 0 0 0 399.21,397.252" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M694.103,397.252 L694.103,407.252 L704.103,407.252 L694.103,397.252" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="405.21" y="417.182" fill="#000" font-size="13" textLength="45.662" font-weight="700" font-family="'Thonburi'">/health</text><text x="455.189" y="417.182" fill="#000" font-size="13" textLength="75.131" font-family="'Thonburi'">ไม่ต้องมี JWT</text><text x="405.21" y="435.077" fill="#000" font-size="13" textLength="283.893" font-family="'Thonburi'">status = health.check(app.state.background)</text><text x="405.21" y="452.972" fill="#000" font-size="13" textLength="139.415" font-family="'Thonburi'">true ครบ 4 ช่อง → 200</text><text x="405.21" y="470.867" fill="#000" font-size="13" textLength="119.102" font-family="'Thonburi'">มีช่องที่ false → 503</text><text x="405.21" y="488.763" fill="#000" font-size="13" textLength="178.222" font-family="'Thonburi'">JSON หน้าตาเดียวกันทั้งสองกรณี</text><text x="413.843" y="506.658" fill="#000" font-size="13" textLength="199.489" font-family="'Thonburi'">{"database": true, "redis": true,</text><text x="418.159" y="524.553" fill="#000" font-size="13" textLength="206.532" font-family="'Thonburi'">"worker": false, "sweeper": true}</text><text x="405.21" y="542.449" fill="#000" font-size="13" textLength="200.845" font-family="'Thonburi'">ไม่ตอบข้อมูลของผู้แจ้งหรือค่าใน .env</text></g><g class="entity" data-qualified-name="GMN22" id="ent0023" data-source-line="91"><path d="M498.9,611.412 L498.9,719.782 L463.96,723.782 L498.9,727.782 L498.9,836.156 A0,0 0 0 0 498.9,836.156 L840.406,836.156 A0,0 0 0 0 840.406,836.156 L840.406,621.412 L830.406,611.412 L498.9,611.412 A0,0 0 0 0 498.9,611.412" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M830.406,611.412 L830.406,621.412 L840.406,621.412 L830.406,611.412" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="504.9" y="631.342" fill="#000" font-size="13" textLength="36.496" font-weight="700" font-family="'Thonburi'">check</text><text x="504.9" y="649.237" fill="#000" font-size="13" textLength="173.636" font-family="'Thonburi'">database = database.ping()</text><text x="504.9" y="667.132" fill="#000" font-size="13" textLength="119.26" font-family="'Thonburi'">redis = redis.ping()</text><text x="504.9" y="685.027" fill="#000" font-size="13" textLength="301.463" font-family="'Thonburi'">worker = is_running(background.get("worker"))</text><text x="504.9" y="702.923" fill="#000" font-size="13" textLength="320.506" font-family="'Thonburi'">sweeper = is_running(background.get("sweeper"))</text><text x="504.9" y="720.818" fill="#000" font-size="13" font-family="'Thonburi'"> </text><text x="504.9" y="738.713" fill="#000" font-size="13" textLength="65.112" font-weight="700" font-family="'Thonburi'">is_running</text><text x="504.9" y="756.609" fill="#000" font-size="13" textLength="263.854" font-family="'Thonburi'">ไม่มี task (WORKER_ENABLED ปิด) → False</text><text x="504.9" y="774.504" fill="#000" font-size="13" textLength="121.149" font-family="'Thonburi'">task จบแล้ว → False</text><text x="513.533" y="792.399" fill="#000" font-size="13" textLength="125.125" font-family="'Thonburi'">run() เป็น while True</text><text x="513.533" y="810.295" fill="#000" font-size="13" textLength="223.249" font-family="'Thonburi'">จบได้ทางเดียวคือ error พาหลุดจาก loop<