 session's chat job was already taken</text><text x="812.902" y="188.488" fill="#000" font-size="14" textLength="231.902">run_chat is inside wait_for_silence</text><rect x="10" y="222.686" width="1498.932" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="222.686" x2="1508.932" y2="222.686" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="225.686" x2="1508.932" y2="225.686" style="stroke:#000;stroke-width:1;"/><rect x="622.757" y="211.441" width="273.417" height="24.488" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="628.757" y="228.977" fill="#000" font-size="14" textLength="254.803" font-weight="700">the new message hits the webhook</text><polygon points="409.71,264.418,419.71,268.418,409.71,272.418,413.71,268.418" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="45.269" y1="268.418" x2="415.71" y2="268.418" style="stroke:#181818;stroke-width:1;"/><text x="52.269" y="263.465" fill="#000" font-size="14" font-weight="700">1</text><text x="65.504" y="263.465" fill="#000" font-size="14" textLength="339.206">POST /webhook/line -> ... -> on_message(event)</text><rect x="376.648" y="276.418" width="1130.283" height="59.465" fill="none" style="stroke:#000;stroke-width:1.5;"/><path d="M376.648,276.418 L441.648,276.418 L441.648,284.418 L431.648,294.418 L376.648,294.418 L376.648,276.418" style="stroke:#000;stroke-width:2;" fill="#EEE"/><text x="389.648" y="291.953" fill="#000" font-size="14" textLength="20.371" font-weight="700">ref</text><text x="696.917" y="311.953" fill="#000" font-size="14" textLength="489.747">same as 4-1 from user.find_by_line_id through session.buffer(message)</text><text x="640.042" y="328.441" fill="#000" font-size="14" textLength="603.497">the message is saved to PSQL (pending), appended to the buffer, last_message_at = now</text><polygon points="660.924,359.371,670.924,363.371,660.924,367.371,664.924,363.371" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="421.71" y1="363.371" x2="666.924" y2="363.371" style="stroke:#181818;stroke-width:1;"/><text x="428.71" y="358.418" fill="#000" font-size="14" font-weight="700">2</text><text x="441.946" y="358.418" fill="#000" font-size="14" textLength="213.979">session.start_buffering(current)</text><polygon points="1462.892,406.348,1472.892,410.348,1462.892,414.348,1466.892,410.348" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="672.924" y1="410.348" x2="1468.892" y2="410.348" style="stroke:#181818;stroke-width:1;"/><text x="679.924" y="397.15" fill="#000" font-size="14" font-weight="700">3</text><text x="693.16" y="388.906" fill="#000" font-size="14" textLength="217.369">set_buffering_if_idle(session_id)</text><text x="693.16" y="405.395" fill="#000" font-size="14" textLength="244.583" font-style="italic">SET session:{id}:state BUFFERING NX</text><polygon points="683.924,436.836,673.924,440.836,683.924,444.836,679.924,440.836" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="677.924" y1="440.836" x2="1473.892" y2="440.836" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="689.924" y="435.883" fill="#000" font-size="14" font-weight="700">4</text><text x="703.16" y="435.883" fill="#000" font-size="14" textLength="34.221">False</text><polygon points="432.71,467.324,422.71,471.324,432.71,475.324,428.71,471.324" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="426.71" y1="471.324" x2="671.924" y2="471.324" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="438.71" y="466.371" fill="#000" font-size="14" font-weight="700">5</text><text x="451.946" y="466.371" fill="#000" font-size="14" textLength="34.221">False</text><path d="M426.71,484.324 L426.71,526.324 L800.71,526.324 L800.71,494.324 L790.71,484.