<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1778px;height:605px;background:#FFFFFF;" width="1778px" height="605px" viewBox="0 0 1778 605" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="7"><text x="791.721" y="23.535" fill="#000" font-size="14" textLength="188.214" font-weight="700">7-2. Redis - session state</text></g><g class="entity" data-qualified-name="IDLE" id="ent0001" data-source-line="9"><rect x="678.31" y="160.728" width="183.953" height="52.977" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="678.31" y1="187.217" x2="862.263" y2="187.217" style="stroke:#181818;stroke-width:0.5;"/><text x="755.5" y="179.263" fill="#000" font-size="14" textLength="29.572">IDLE</text><text x="683.31" y="205.752" fill="#000" font-size="14" textLength="163.953">no session:{id}:state key</text></g><g class="entity" data-qualified-name="BUFFERING" id="ent0002" data-source-line="10"><rect x="7" y="331.198" width="322.565" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="7" y1="357.687" x2="329.565" y2="357.687" style="stroke:#181818;stroke-width:0.5;"/><text x="131.434" y="349.733" fill="#000" font-size="14" textLength="73.698">BUFFERING</text><text x="12" y="376.222" fill="#000" font-size="14" textLength="126.827">state = BUFFERING</text><text x="12" y="392.71" fill="#000" font-size="14" textLength="302.565">one chat job is queued or waiting for silence</text></g><g class="entity" data-qualified-name="PROCESSING" id="ent0003" data-source-line="11"><rect x="571.1" y="518.148" width="182.36" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="571.1" y1="544.637" x2="753.46" y2="544.637" style="stroke:#181818;stroke-width:0.5;"/><text x="620.123" y="536.683" fill="#000" font-size="14" textLength="84.314">PROCESSING</text><text x="576.1" y="563.172" fill="#000" font-size="14" textLength="137.443">state = PROCESSING</text><text x="576.1" y="579.66" fill="#000" font-size="14" textLength="162.36">the worker is answering</text></g><g class="entity" data-qualified-name="CLOSING" id="ent0004" data-source-line="12"><rect x="1335.48" y="331.198" width="251.608" height="69.465" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="1335.48" y1="357.687" x2="1587.088" y2="357.687" style="stroke:#181818;stroke-width:0.5;"/><text x="1431.254" y="349.733" fill="#000" font-size="14" textLength="60.061">CLOSING</text><text x="1340.48" y="376.222" fill="#000" font-size="14" textLength="113.189">state = CLOSING</text><text x="1340.48" y="392.71" fill="#000" font-size="14" textLength="231.608">the sweeper is closing the session</text></g><g class="start_entity" data-qualified-name=".start." id="ent0005" data-source-line="14"><ellipse cx="770.28" cy="53.488" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0012" data-source-line="22"><ellipse cx="1130.28" cy="552.878" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="1130.28" cy="552.878" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN14" id="ent0015" data-source-line="25"><path d="M896.85,157.488 L896.85,183.218 L862.62,187.218 L896.85,191.218 L896.85,216.953 A0,0 0 0 0 896.85,216.953 L1263.714,216.953 A0,0 0 0 0 1263.714,216.953 L1263.714,167.488 L1253.714,157.488 L896.85,157.488 A0,0 0 0 0 896.85,157.488" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1253.714,157.488 L1253.714,167.488 L1263.714,167.488 L1253.714,157.488" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="902.85" y="176.023" fill="#000" font-size="14" textLength="175.308">a message arrives -> 4-1</text><text x="902.85" y="192.512" fill="#000" font-size="14" textLength="345.864">SET NX succeeds only from IDLE, so only one caller</text><text x="902.85" y="209" fill="#000" font-size="14" textLength="295.866">wins the move to BUFFERING or to CLOSING</text></g><g class="entity" data-qualified-name="GMN17" id="ent0018" data-source-line="31"><path d="M364.65,344.438 L364.65,361.928 L329.94,365.928 L364.65,369.928 L364.65,387.415 A0,0 0 0 0 364.65,387.415 L591.924,387.415 A0,0 0 0 0 591.924,387.415 L591.924,354.438 L581.924,344.438 L364.65,344.438 A0,0 0 0 0 364.65,344.438" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M581.924,344.438 L581.924,354.438 L591.924,354.438 L581.924,344.438" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="370.65" y="362.973" fill="#000" font-size="14" textLength="175.308">a message arrives -> 4-3</text><text x="370.65" y="379.462" fill="#000" font-size="14" textLength="206.274">the sweeper skips this session</text></g><g class="entity" data-qualified-name="GMN20" id="ent0021" data-source-line="36"><path d="M1176.12,514.908 L1176.12,590.861 L1530.447,590.861 L1530.447,524.908 L1520.447,514.908 L1176.12,514.908" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1520.447,514.908 L1520.447,524.908 L1530.447,524.908 L1520.447,514.908" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="1182.12" y="533.443" fill="#000" font-size="14" textLength="175.308">a message arrives -> 4-4</text><text x="1182.12" y="549.932" fill="#000" font-size="14" textLength="206.274">the sweeper skips this session</text><text x="1182.12" y="566.42" fill="#000" font-size="14" textLength="333.327">run_chat ends with an error before session.finish</text><text x="1182.12" y="582.908" fill="#000" font-size="14" textLength="240.181">-> the key stays PROCESSING (4-2)</text></g><g class="entity" data-qualified-name="GMN23" id="ent0024" data-source-line="43"><path d="M931.64,327.948 L931.64,403.901 A0,0 0 0 0 931.64,403.901 L1300.931,403.901 A0,0 0 0 0 1300.931,403.901 L1300.931,369.928 L1335.01,365.928 L1300.931,361.928 L1300.931,337.948 L1290.931,327.948 L931.64,327.948 A0,0 0 0 0 931.64,327.948" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1290.931,327.948 L1290.931,337.948 L1300.931,337.948 L1290.931,327.948" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="937.64" y="346.483" fill="#000" font-size="14" textLength="175.308">a message arrives -> 4-5</text><text x="937.64" y="362.972" fill="#000" font-size="14" textLength="337.415">after CLOSING -> IDLE, if the buffer is not empty:</text><text x="937.64" y="379.46" fill="#000" font-size="14" textLength="348.291">sweeper.finish_closing calls session.start_buffering</text><text x="937.64" y="395.948" fill="#000" font-size="14" textLength="294.759">and job.enqueue_chat (IDLE -> BUFFERING)</text></g><!--link *start* to IDLE--><g class="link" data-entity-1="ent0005" data-entity-2="ent0001" id="lnk6" data-source-line="14" data-link-type="dependency"><path d="M770.28,63.958 C770.28,83.898 770.28,125.798 770.28,155.368" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-IDLE"/><polygon points="770.28,160.368,774.28,151.368,770.28,155.368,766.28,151.368,770.28,160.368" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="771.28" y="108.023" fill="#000" font-size="14" textLength="283.165">session.open_for opens a session in PSQL</text><text x="824.624" y="124.512" fill="#000" font-size="14" textLength="176.477">Redis has no key for it yet</text></g><!--link IDLE to BUFFERING--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk7" data-source-line="16" data-link-type="dependency"><path d="M677.91,189.768 C548.78,193.428 322.27,205.718 252.28,246.948 C219.79,266.098 198.754,298.83 185.074,326.37" style="stroke:#181818;stroke-width:1;" fill="none" id