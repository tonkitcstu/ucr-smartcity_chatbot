="217.834">worker.run_chat, after line.reply</text><text x="681.28" y="379.952" fill="#000" font-size="14" textLength="232.511">session.finish -> clear_state (DEL)</text></g><!--link IDLE to CLOSING--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk10" data-source-line="20" data-link-type="dependency"><path d="M802.95,214.058 C838.1,240.268 896.72,279.518 954.28,297.948 C1108.87,347.468 1158.23,300.868 1318.28,327.948 C1323.85,328.888 1324.607,328.968 1330.307,330.108" style="stroke:#181818;stroke-width:1;" fill="none" id="IDLE-to-CLOSING"/><polygon points="1335.21,331.088,1327.169,325.401,1330.307,330.108,1325.6,333.246,1335.21,331.088" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="955.28" y="269.983" fill="#000" font-size="14" textLength="383.134">sweeper.sweep, session silent > CLOSE_AFTER_MINUTES</text><text x="969.8" y="286.472" fill="#000" font-size="14" textLength="354.095">session.start_closing -> set_closing_if_idle (SET NX)</text></g><!--link CLOSING to IDLE--><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" id="lnk11" data-source-line="21" data-link-type="dependency"><path d="M1438.13,330.768 C1417.03,302.788 1383.14,264.988 1343.28,246.948 C1249.15,204.358 981.27,233.528 879.28,216.948 C873.78,216.058 873.046,216.02 867.386,214.85" style="stroke:#181818;stroke-width:1;" fill="none" id="CLOSING-to-IDLE"/><polygon points="862.49,213.838,870.494,219.577,867.386,214.85,872.113,211.743,862.49,213.838" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1409.04" y="269.983" fill="#000" font-size="14" textLength="353.616">sweeper.finish_closing, session.close returned False</text><text x="1445.869" y="286.472" fill="#000" font-size="14" textLength="279.959">session.stop_closing -> clear_state (DEL)</text></g><!--link CLOSING to *end*--><g class="link" data-entity-1="ent0004" data-entity-2="ent0012" id="lnk13" 