[project]
name = "ucr-smartcity-chatbot"
version = "0.1.0"
description = "น้องเมือง — บอทเก็บเสียงคนในชุมชนเรื่องสภาพแวดล้อมเมือง ให้ทีมออกแบบใช้ตัดสินใจ"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.140.7",
    "line-bot-sdk>=3.25.0",
    "openai>=2.49.0",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.2",
    "redis>=6.0.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
